name = "kkoribyeol"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# 게임 화면 (public 폴더)
[assets]
directory = "./public"
binding = "ASSETS"

# 줄·갓챠·랭킹·펫 그림을 모아두는 공용 저장소 (무료 플랜에서 되는 SQLite 방식)
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# 비밀 값은 여기 적지 말고 Cloudflare 화면의 Variables and Secrets에서 넣기
#   GEMINI_API_KEY : 제미나이 키
#   ACCESS_CODE    : 친구들한테 알려줄 입장 코드
