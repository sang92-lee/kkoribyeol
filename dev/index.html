<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8EE">
<title>꼬리별</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 위엔 작은 머리띠, 가운데 탭 화면, 아래 탭 3개. 크림 바탕 + 갈색 손그림 테두리 */
:root {
  --bg: #FFF8EE; --card: #FFFFFF; --ink: #4A3428; --soft: #8C7466; --line: #EADCCB;
  --pink: #F2A0B3; --pink-deep: #E07C95; --mint: #CBEBDD; --sky: #DCEBFA; --butter: #FFE7A6; --gold: #F2BE4B;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r: 20px; --stroke: 2.5px solid var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }

.hdr { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; justify-content: space-between; }
.hdr h1 { font-size: 26px; letter-spacing: .02em; }
.hdr h1 span { color: var(--pink-deep); }
.who { font-size: 14px; color: var(--soft); }
main { max-width: 520px; margin: 0 auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.view { display: flex; flex-direction: column; gap: 16px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: var(--stroke); display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs button { border: 0; background: none; padding: 6px 4px; border-radius: 14px; font-family: var(--display); font-size: 16px; color: var(--soft); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.tabs button svg { width: 26px; height: 26px; }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--butter); }
.tabs .dot { position: absolute; top: 4px; right: calc(50% - 22px); width: 10px; height: 10px; border-radius: 50%; background: var(--pink-deep); border: 2px solid var(--card); }

.card { background: var(--card); border: var(--stroke); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-size: 21px; display: flex; align-items: center; gap: 8px; }
.note { margin: 0; color: var(--soft); font-size: 14px; }
.btn { border: var(--stroke); border-radius: 999px; padding: 12px 18px; background: var(--card); font-family: var(--display); font-size: 18px; box-shadow: 0 3px 0 var(--ink); transition: transform .08s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.main { background: var(--pink); }
.btn.big { width: 100%; font-size: 20px; padding: 14px 18px; }
.btn:disabled { opacity: .5; box-shadow: none; transform: none; cursor: default; }
.btn.urgent { background: var(--pink-deep); color: #FFFFFF; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.03); } }
.link { border: 0; background: none; color: var(--soft); text-decoration: underline; font-size: 14px; padding: 4px; align-self: center; }
.err { color: #C2415A; font-size: 14px; margin: 0; }

label.f { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--soft); }
input[type=text] { font: 16px var(--body); color: var(--ink); padding: 12px 14px; border: var(--stroke); border-radius: 14px; background: var(--bg); width: 100%; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: var(--stroke); border-radius: 999px; padding: 8px 16px; background: var(--card); font-family: var(--display); font-size: 16px; }
.chip[aria-pressed="true"] { background: var(--mint); }

/* 입장 */
.gate { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.gate .card { width: min(380px, 100%); align-items: stretch; text-align: center; }
.gate img { width: 160px; height: 160px; object-fit: cover; border-radius: 50%; border: var(--stroke); align-self: center; animation: bob 2.6s ease-in-out infinite; }
.gate h1 { font-size: 34px; }
.gate h1 span { color: var(--pink-deep); }

/* 사진 → 캐릭터 */
.drop { position: relative; border: 2.5px dashed var(--soft); border-radius: var(--r); min-height: 150px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--soft); font-family: var(--display); overflow: hidden; background: var(--bg); }
.drop input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.drop img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
.morph { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.morph .pic { aspect-ratio: 1; border: var(--stroke); border-radius: 18px; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.morph .pic img { width: 100%; height: 100%; object-fit: cover; }
.morph .arrow { font-family: var(--display); font-size: 26px; color: var(--pink-deep); }
.loading { font-family: var(--display); color: var(--soft); text-align: center; font-size: 15px; padding: 8px; }
.loading i { display: block; width: 46px; height: 46px; margin: 0 auto 6px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--pink-deep); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 우리 방 */
.room { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border: var(--stroke); border-radius: var(--r); overflow: hidden; background: linear-gradient(#E7DDF8 0%, #F6E7EE 58%, #F3DDC0 58%, #EED1AE 100%); touch-action: manipulation; }
.room .it { position: absolute; width: 30%; }
.room .it svg { width: 100%; height: auto; display: block; }
.room .lamp { left: 4%; top: 0; width: 22%; }
.room .cloud { right: 4%; top: 8%; }
.room .hammock { left: 3%; bottom: 8%; }
.room .slide { right: 3%; bottom: 8%; }
.room .pet { position: absolute; left: 50%; bottom: 9%; width: 54%; transform: translateX(-50%); cursor: pointer; }
.room .pet .bob { animation: bob 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
.room .pet img { width: 100%; display: block; border-radius: 50%; mix-blend-mode: multiply; }
.room .bubble { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); background: var(--card); border: var(--stroke); border-radius: 16px; padding: 6px 14px; font-family: var(--display); white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; }
.room .bubble.on { opacity: 1; }
.heart { position: absolute; font-size: 22px; color: var(--pink-deep); pointer-events: none; animation: rise 1.1s ease-out forwards; }
@keyframes rise { to { transform: translateY(-80px); opacity: 0; } }
@keyframes bob { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-6px) scale(1.02,.98); } }
.petName { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.petName h2 { font-size: 24px; }
.brag { background: var(--butter); border-radius: 14px; padding: 8px 12px; font-size: 15px; margin: 0; }

/* 갓챠 */
.roundBar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--display); font-size: 16px; }
.roundBar .left b { color: var(--pink-deep); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.roundBar .clock { font-variant-numeric: tabular-nums; color: var(--soft); }
.machine { display: flex; justify-content: center; }
.machine svg { width: min(230px, 70%); height: auto; }
.machine.shake svg { animation: shake .12s linear 8; }
@keyframes shake { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
.lineWrap { overflow-x: auto; margin: 0 -16px; padding: 4px 16px 8px; scrollbar-width: none; }
.line { display: flex; gap: 10px; min-width: min-content; }
.qp { flex: none; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--soft); text-align: center; }
.qp .av { width: 58px; height: 58px; border-radius: 50%; border: var(--stroke); background: var(--bg); overflow: hidden; position: relative; }
.qp .av img, .qp .av svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.qp .no { font-family: var(--display); font-size: 14px; color: var(--ink); }
.qp .nm { max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qp.me .av { border-color: var(--pink-deep); box-shadow: 0 0 0 3px var(--pink); }
.qp.me .nm { color: var(--pink-deep); font-family: var(--display); }
.qp.turn .av { animation: bob .8s ease-in-out infinite; }
.lineEmpty { color: var(--soft); font-size: 14px; padding: 12px 0; }
.myLine { text-align: center; font-family: var(--display); font-size: 19px; margin: 0; min-height: 1.5em; }
.myLine small { display: block; font-family: var(--body); font-size: 14px; color: var(--soft); }

.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rank li { display: grid; grid-template-columns: 30px 46px 1fr auto; align-items: center; gap: 10px; border: var(--stroke); border-radius: 16px; padding: 6px 12px; background: var(--card); }
.rank li:nth-child(1) { background: #FFF1C2; }
.rank li:nth-child(2) { background: #E8F1FB; }
.rank li:nth-child(3) { background: #FBE6D8; }
.rank li.mine { box-shadow: 0 0 0 3px var(--pink); }
.rank .medal { font-family: var(--display); font-size: 18px; text-align: center; }
.rank .av { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; border: 2px solid var(--ink); background: var(--bg); }
.rank .av img, .rank .av svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.rank .nm { min-width: 0; font-family: var(--display); font-size: 16px; line-height: 1.25; }
.rank .nm small { display: block; font-family: var(--body); font-size: 12px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank .ct { font-family: var(--display); color: var(--pink-deep); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank .empty { display: block; border: 0; background: none; padding: 0; color: var(--soft); font-size: 14px; }

/* 굿즈 */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.good { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; text-align: center; color: var(--soft); min-width: 0; }
.good .frame { width: 100%; aspect-ratio: 1; position: relative; display: flex; align-items: center; justify-content: center; }
.good .frame .face { width: 78%; height: 78%; border-radius: 50%; overflow: hidden; position: relative; z-index: 1; }
.good .frame .face img, .good .frame .face svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.good .cnt { position: absolute; top: 2px; right: 2px; z-index: 2; background: var(--ink); color: #FFFFFF; font-family: var(--display); font-size: 12px; border-radius: 999px; padding: 0 7px; }
.good b { font-family: var(--display); font-weight: 400; color: var(--ink); font-size: 14px; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-sticker .frame .face { border: 6px solid #FFFFFF; box-shadow: 0 0 0 2.5px var(--ink); transform: rotate(-4deg); }
.g-keyring .frame { padding-top: 14%; }
.g-keyring .frame .face { border: var(--stroke); width: 70%; height: 70%; }
.g-keyring .ring { position: absolute; top: 2%; left: 50%; transform: translateX(-50%); width: 22%; aspect-ratio: 1; border: 3px solid #A9A4AE; border-radius: 50%; }
.g-plush .frame { background: radial-gradient(circle, #FBD9E2 0 62%, transparent 63%); }
.g-plush .frame .face { border: 3px dashed var(--pink-deep); }
.g-figure .frame::after { content: ""; position: absolute; bottom: 4%; left: 14%; right: 14%; height: 16%; background: var(--gold); border: var(--stroke); border-radius: 50%; }
.g-figure .frame .face { border: 3px solid var(--gold); margin-bottom: 12%; filter: saturate(1.1); }
.g-figure .star { position: absolute; top: 2%; right: 8%; color: var(--gold); font-size: 20px; z-index: 2; }
.locked { opacity: .45; filter: grayscale(1); }
.items { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.item { border: var(--stroke); border-radius: 16px; padding: 6px 4px; background: var(--bg); text-align: center; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; min-width: 0; }
.item svg { width: 100%; height: auto; }
.item b { font-family: var(--display); font-weight: 400; font-size: 13px; }
.item.rare { background: #FFF1C2; }

/* 결과 */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(74,52,40,.55); display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal .card { width: min(340px, 100%); align-items: center; text-align: center; }
.capsule { width: 150px; height: 150px; position: relative; }
.capsule .top, .capsule .bot { position: absolute; left: 0; width: 150px; height: 75px; border: 3px solid var(--ink); }
.capsule .top { top: 0; border-radius: 75px 75px 0 0; background: var(--pink); transition: transform .5s, opacity .5s; }
.capsule .bot { bottom: 0; border-radius: 0 0 75px 75px; background: #FFFFFF; transition: transform .5s, opacity .5s; }
.capsule.shake { animation: shake .14s linear 7; }
.capsule.open .top { transform: translateY(-90px) rotate(-25deg); opacity: 0; }
.capsule.open .bot { transform: translateY(90px); opacity: 0; }
.reveal { animation: pop .6s cubic-bezier(.3,1.6,.5,1); width: 170px; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } }
.badge { display: inline-block; border: var(--stroke); border-radius: 999px; padding: 2px 12px; font-family: var(--display); font-size: 14px; background: var(--mint); }
.badge.rare { background: var(--gold); }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 25; background: var(--ink); color: #FFFFFF; border-radius: 999px; padding: 10px 18px; font-size: 15px; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="hdr"><h1>꼬리<span>별</span></h1><span class="who" id="who"></span></header>

<main>
  <!-- 우리 아이 -->
  <section class="view" id="vPet" aria-label="우리 아이">
    <div class="card" id="maker" hidden>
      <h2>내 사진으로 만들기</h2>
      <p class="note">우리 애 사진 한 장이면 꼬리별 그림체로 그려 줘요. 얼굴이 잘 보이는 사진이 좋아요</p>
      <div class="drop" id="drop"><span id="dropText">사진 고르기</span><input type="file" id="photo" accept="image/*" aria-label="사진 고르기"></div>
      <div class="chips" role="group" aria-label="종류">
        <button type="button" class="chip" data-kind="hamster" aria-pressed="true">햄찌</button>
        <button type="button" class="chip" data-kind="dog" aria-pressed="false">강아지</button>
        <button type="button" class="chip" data-kind="cat" aria-pressed="false">고양이</button>
      </div>
      <label class="f">이름<input type="text" id="petName" maxlength="12" placeholder="예: 자장이" autocomplete="off"></label>
      <p class="err" id="makeErr" hidden></p>
      <button type="button" class="btn main big" id="btnDraw">꼬리별 그림체로 그리기</button>
      <p class="note" id="drawLeft"></p>
      <div id="drawOut" hidden>
        <div class="morph"><div class="pic" id="morphA"></div><span class="arrow">→</span><div class="pic" id="morphB"></div></div>
      </div>
      <div class="loading" id="drawing" hidden><i></i>그리는 중이에요 · 20초쯤 걸려요</div>
      <div class="chips" id="pickRow" hidden>
        <button type="button" class="btn main" id="btnKeep" style="flex:1">이 그림으로 정하기</button>
        <button type="button" class="btn" id="btnRedo">다시 그리기</button>
      </div>
      <button type="button" class="link" id="btnCancelMake" hidden>그냥 원래 그림 쓸래요</button>
    </div>

    <div class="card" id="home" hidden>
      <div class="petName"><h2 id="homeName"></h2><span class="note" id="homeKind"></span></div>
      <div class="room" id="room"><div class="bubble" id="bubble"></div></div>
      <p class="brag" id="brag" hidden></p>
      <p class="note">탭하면 반응해요. 갓챠에서 방 아이템을 뽑으면 여기 생겨요</p>
      <button type="button" class="link" id="btnRemake">사진으로 다시 그리기</button>
    </div>
  </section>

  <!-- 갓챠 -->
  <section class="view" id="vGacha" aria-label="갓챠" hidden>
    <div class="card">
      <div class="roundBar"><span class="left">남은 캡슐 <b id="left">-</b></span><span class="clock" id="clock"></span></div>
      <div class="machine" id="machine"></div>
      <p class="note" style="text-align:center">통 안엔 친구들 펫 굿즈랑 방 아이템이 섞여 있어요</p>
    </div>
    <div class="card">
      <h2>지금 줄</h2>
      <div class="lineWrap"><div class="line" id="line"></div></div>
      <p class="myLine" id="myLine"></p>
      <button type="button" class="btn main big" id="btnLine" disabled>줄 서기</button>
      <p class="err" id="lineErr" hidden></p>
    </div>
    <div class="card">
      <h2>이번 주 많이 뽑힌 펫</h2>
      <ol class="rank" id="rank"></ol>
    </div>
  </section>

  <!-- 진열장 -->
  <section class="view" id="vShelf" aria-label="진열장" hidden>
    <div class="card">
      <h2>우리 방 아이템</h2>
      <div class="items" id="items"></div>
    </div>
    <div class="card">
      <h2>모은 펫 굿즈</h2>
      <div class="grid" id="goods"></div>
    </div>
  </section>
</main>

<nav class="tabs" role="tablist" aria-label="화면">
  <button role="tab" data-tab="vPet" aria-selected="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><ellipse cx="16" cy="19" rx="11" ry="9"/><circle cx="8" cy="9" r="3.5"/><circle cx="24" cy="9" r="3.5"/><circle cx="12" cy="18" r="1.2" fill="currentColor"/><circle cx="20" cy="18" r="1.2" fill="currentColor"/></svg>우리 아이</button>
  <button role="tab" data-tab="vGacha" aria-selected="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="16" cy="12" r="9"/><path d="M9 20h14l-2 9H11z"/><circle cx="16" cy="25" r="1.6" fill="currentColor"/></svg>갓챠<span class="dot" id="gDot" hidden></span></button>
  <button role="tab" data-tab="vShelf" aria-selected="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="5" width="24" height="23" rx="3"/><path d="M4 16h24"/><circle cx="11" cy="11" r="2.5"/><rect x="18" y="20" width="5" height="5" rx="1"/></svg>진열장</button>
</nav>

<div class="gate" id="gate" hidden>
  <div class="card">
    <img src="/style.jpg" alt="꼬리별 햄찌">
    <h1>꼬리<span>별</span></h1>
    <p class="note">우리 애를 꼬리별 친구로 만들고, 친구들이랑 같은 갓챠 줄에 서요</p>
    <label class="f">입장 코드<input type="text" id="gCode" autocomplete="off" placeholder="친구가 알려준 코드"></label>
    <label class="f">내 닉네임<input type="text" id="gNick" maxlength="12" autocomplete="off" placeholder="예: 메롱"></label>
    <p class="err" id="gErr" hidden></p>
    <button type="button" class="btn main big" id="gGo">들어가기</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="card" id="modalCard"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem('kk_' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('kk_' + k, v); } catch (e) {} },
};

  const mine = S.state.mine || [], own = {};
  mine.filter(x => x.kind === 'item').forEach(x => own[x.a] = (own[x.a] || 0) + 1);
  $('#items').innerHTML = ITEM_ORDER.map(i => `<div class="item ${i === 'cloud' ? 'rare' : ''} ${own[i] ? '' : 'locked'}">${ITEM_SVG[i]}<b>${own[i] ? ITEMS[i] : '???'}</b>${own[i] > 1 ? `<span>×${own[i]}</span>` : ''}</div>`).join('');
  const g = {};
  mine.filter(x => x.kind === 'pet').forEach(x => { const k = x.a + '|' + x.b; g[k] = (g[k] || 0) + 1; });
  const keys = Object.keys(g);
  $('#goods').innerHTML = keys.length ? keys.map(k => { const [a, b] = k.split('|'); return goodsHTML(a, b, g[k]); }).join('') : `<p class="note" style="grid-column:1/-1">아직 없어요. 갓챠에서 친구들 펫 굿즈를 모아 보세요</p>`;
}

/* ---------- 내 차례 알림 ---------- */
let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} }
function alertTurn() {
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  if (actx) { [880, 1175, 1568].forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * .14; o.frequency.value = f; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .25); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .26); }); }
  document.title = '내 차례! · 꼬리별';
  toast('내 차례예요! 갓챠에서 뽑아 주세요');
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { document.title = '꼬리별'; refresh(); } });

/* ---------- 탭 ---------- */
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  ['vPet', 'vGacha', 'vShelf'].forEach(v => $('#' + v).hidden = v !== S.tab);
  window.scrollTo(0, 0); unlockAudio();
  if (S.tab === 'vGacha') document.title = '꼬리별';
});

function boot() {
  $('#who').textContent = `${S.nick}님`;
  refresh();
  clearInterval(boot.p); clearInterval(boot.c);
  boot.p = setInterval(() => { if (!document.hidden) refresh(); }, 3000);
  boot.c = setInterval(tickGacha, 1000);
}
if (S.code && S.nick) {
  api('hello', { id: S.id, nick: S.nick }).then(r => { S.drawsLeft = r.drawsLeft; boot(); }).catch(() => { $('#gCode').value = ''; $('#gNick').value = S.nick; $('#gate').hidden = false; });
} else { $('#gNick').value = S.nick; $('#gate').hidden = false; }
</script>
</body>
